ext.ReactNativeThorVG = [
  minSdkVersion: 24,
  compileSdkVersion: 36
]

ext.getExtOrDefault = { prop ->
  if (rootProject.ext.has(prop)) {
    return rootProject.ext.get(prop)
  }

  return ReactNativeThorVG[prop]
}

static def resolveNodePackage(String name, File baseDir) {
  def script = "process.stdout.write(require('path').dirname(require.resolve('${name}/package.json')))"
  def process = ["node", "-e", script].execute(null, baseDir)
  def output = process.text.trim()
  return process.waitFor() == 0 && output ? output : null
}

def resolveThorVGLibs() {
  def local = file("${projectDir}/../libs/android")
  if (new File(local, "include/thorvg_capi.h").exists()) {
    return local.absolutePath
  }
  def core = resolveNodePackage("@thorvg/react-native-thorvg-core-android", projectDir)
  if (core != null && new File(core, "libs/include/thorvg_capi.h").exists()) {
    return "${core}/libs"
  }
  throw new GradleException("ReactNativeThorVG: prebuilt ThorVG not found. Run `yarn build:thorvg android` or install @thorvg/react-native-thorvg-core-android.")
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

apply plugin: "com.android.library"

if (project.extensions.findByName("kotlin") == null) {
  apply plugin: "kotlin-android"
}

apply plugin: "com.facebook.react"

android {
  namespace "org.thorvg.reactnative"

  compileSdkVersion getExtOrDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion")

    externalNativeBuild {
      cmake {
        cppFlags "-fexceptions", "-frtti", "-std=c++20"
        arguments "-DANDROID_STL=c++_shared",
                  "-DTHORVG_LIBS=${resolveThorVGLibs()}"
        abiFilters(*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    prefab true
  }

  packaging {
    jniLibs {
      excludes += [
        "**/libc++_shared.so",
        "**/libfbjni.so",
        "**/libjsi.so",
        "**/libreactnative.so"
      ]
    }
  }
}

dependencies {
  implementation "com.facebook.react:react-android"
}
